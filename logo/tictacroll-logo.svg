<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TicTacRoll app icon: a tilted die whose face is a mini tic-tac-toe board -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A88C7"/>
      <stop offset="1" stop-color="#3E78B2"/>
    </linearGradient>
    <linearGradient id="dieface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EDDF"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>

  <!-- soft ground shadow -->
  <ellipse cx="512" cy="852" rx="300" ry="58" fill="#1F3A56" opacity="0.35"/>

  <g transform="rotate(-8 512 512)">
    <!-- die depth: right side -->
    <path d="M 812 232 L 862 282 L 862 762 L 812 812 Z" fill="#C9B98E"/>
    <!-- die depth: bottom -->
    <path d="M 212 812 L 262 862 L 742 862 L 812 812 Z" fill="#B5A67E" opacity="0.9"/>

    <!-- die face -->
    <rect x="212" y="212" width="600" height="600" rx="96" fill="url(#dieface)" stroke="#2B2B2B" stroke-width="18"/>

    <!-- corner pips (keep the 'dice' read) -->
    <circle cx="308" cy="308" r="26" fill="#2B2B2B"/>
    <circle cx="716" cy="308" r="26" fill="#2B2B2B"/>
    <circle cx="308" cy="716" r="26" fill="#2B2B2B"/>
    <circle cx="716" cy="716" r="26" fill="#2B2B2B"/>

    <!-- mini board grid -->
    <g stroke="#3E78B2" stroke-width="22" stroke-linecap="round">
      <line x1="452" y1="360" x2="452" y2="664"/>
      <line x1="572" y1="360" x2="572" y2="664"/>
      <line x1="360" y1="452" x2="664" y2="452"/>
      <line x1="360" y1="572" x2="664" y2="572"/>
    </g>

    <!-- marks: red crosses -->
    <g stroke="#E94F37" stroke-width="30" stroke-linecap="round">
      <g>
        <line x1="378" y1="378" x2="434" y2="434"/>
        <line x1="434" y1="378" x2="378" y2="434"/>
      </g>
      <g>
        <line x1="590" y1="498" x2="646" y2="554"/>
        <line x1="646" y1="498" x2="590" y2="554"/>
      </g>
      <g>
        <line x1="470" y1="590" x2="526" y2="646"/>
        <line x1="526" y1="590" x2="470" y2="646"/>
      </g>
    </g>

    <!-- marks: yellow circles -->
    <g stroke="#F6C90E" stroke-width="30" fill="none">
      <circle cx="512" cy="406" r="34"/>
      <circle cx="406" cy="512" r="34"/>
      <circle cx="618" cy="618" r="34"/>
    </g>
  </g>
</svg>
